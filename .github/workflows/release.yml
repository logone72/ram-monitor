name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - run: brew bundle --file=Brewfile
      - run: make verify
      - name: Validate tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build release
        run: ./scripts/build-release.sh "$VERSION"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "release/RAM-Monitor-$VERSION.dmg" \
            "release/SHA256SUMS" \
            "release/ram-monitor.rb" \
            --verify-tag \
            --generate-notes \
            --title "RAM Monitor $VERSION"
